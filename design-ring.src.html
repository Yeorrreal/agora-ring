<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>디자인 링</title>
<style>
@font-face{font-family:"Galmuri11";src:url(data:font/woff2;base64,__FONT_REG__) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Galmuri11";src:url(data:font/woff2;base64,__FONT_BOLD__) format("woff2");font-weight:700;font-display:block}
:root{color-scheme:dark;
  --bg:#16121b;--panel:rgba(30,23,37,.92);--panel2:#2e2537;--edge:#0b090e;--hi:#4b3e59;
  --ink:#f2ead9;--muted:#a89cb3;--gold:#e8c35a;--red:#e0563b;--blue:#4d7fd6;--parch:#fbf5e6;--dark:#1a1418;
  --pix:"Galmuri11","DungGeunMo","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --gl:max(12px,env(safe-area-inset-left,0px));--gr:max(12px,env(safe-area-inset-right,0px))}
body.mies{--bg:#fff;--panel:rgba(255,255,255,.96);--panel2:#e6e6e6;--edge:#111;--hi:#fff;--ink:#111;--muted:#666;--gold:#111;--red:#666;--blue:#999;--parch:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--pix);font-size:12.5px;line-height:1.5;margin:0;overflow:hidden;-webkit-font-smoothing:none}
p,h1,h2,ul{margin:0;padding:0}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;overflow:hidden}
canvas#scene{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
canvas#scene.grab{cursor:grab}canvas#scene.grabbing{cursor:grabbing}
.panel{background:var(--panel);box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi),4px 4px 0 2px rgba(0,0,0,.3)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.05em}
.hdr{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gr) 0 var(--gl);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.hdr>*{pointer-events:auto}
.bar{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px 4px 12px}
.bar h1{font-size:13.5px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .acts{display:flex;gap:6px;flex:none}
.center{display:flex;align-items:flex-start;justify-content:center;gap:10px;width:100%;max-width:560px;pointer-events:none}
.center>*{pointer-events:auto}
.rc{flex:1 1 0;min-width:0;padding:8px 10px;text-align:center;font-weight:700;font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 0 2px var(--edge),4px 4px 0 2px rgba(0,0,0,.3)}
.c0{background:var(--red);color:var(--dark)}.c1{background:var(--blue);color:#fff}
.bell{flex:none;width:58px;height:62px;padding:0;border:0;cursor:pointer;background:transparent center/100% 100% no-repeat;image-rendering:pixelated;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.3));transform-origin:50% 8%}
.bell.ding{animation:ding .45s steps(6)}
@keyframes ding{0%,100%{rotate:0deg}20%{rotate:-14deg}40%{rotate:11deg}60%{rotate:-7deg}80%{rotate:4deg}}
.bell:focus-visible,.btn:focus-visible,.kwbtn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn{font:inherit;font-weight:700;font-size:12.5px;border:0;cursor:pointer;padding:7px 12px;background:var(--gold);color:var(--dark);white-space:nowrap;box-shadow:0 0 0 2px var(--dark),inset -2px -3px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.35)}
body.mies .btn:not(.ghost){color:#fff}body.mies .bell{filter:grayscale(1)}
.btn.ghost{background:var(--panel2);color:var(--ink);font-weight:400;font-size:11.5px;padding:4px 8px}
.btn.icon{display:flex;align-items:center;justify-content:center;padding:3px 5px}.hicon{display:block;width:16px;height:16px;image-rendering:pixelated}body.mies .hicon{filter:invert(1)}
.btn:active{transform:translate(1px,1px)}
.narr{position:fixed;left:var(--gl);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;width:min(340px,calc(100vw - 24px));padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.narr b{color:var(--gold);font-size:13.5px}.narr .y{font-size:11px;color:var(--muted)}
.stelebox{position:fixed;right:var(--gr);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;width:190px;padding:10px;display:flex;flex-direction:column;gap:6px}
.stele{list-style:none;padding:6px;background:#cfc7b4;box-shadow:inset 0 0 0 2px #a59d89,inset 0 0 0 4px #ded7c6}
.kwbtn{font:inherit;font-size:11.5px;width:100%;border:0;background:transparent;padding:3px 4px;color:#6f6656;text-align:left;cursor:default}
.kwbtn.got{color:#2a2117;cursor:pointer;font-weight:700}
.bubbles{position:fixed;inset:0;z-index:11;pointer-events:none}
.bub{position:absolute;background:var(--parch);color:var(--dark);font-size:12px;line-height:17px;padding:5px 8px 6px;width:max-content;max-width:190px;box-shadow:0 0 0 2px #1a1418,3px 3px 0 2px rgba(0,0,0,.35);transform:translate(-50%,-100%);word-break:keep-all}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-5px;border:5px solid transparent;border-top:6px solid #1a1418;border-bottom:0}
.bub.shout{font-weight:700;background:#fff0a8}body.mies .bub.shout{background:#fff}
.ptip{position:fixed;background:var(--parch);color:var(--dark);font-size:12px;font-weight:700;padding:4px 8px 5px;white-space:nowrap;box-shadow:0 0 0 2px #1a1418,3px 3px 0 2px rgba(0,0,0,.35);pointer-events:none;z-index:12;transform:translate(-50%,-100%)}
.tut{position:fixed;z-index:13;width:min(300px,calc(100vw - 32px));background:#fbf5e6;color:#1a1418;padding:12px 14px 10px;font-size:13px;line-height:20px;word-break:keep-all;box-shadow:0 0 0 2px #1a1418,5px 5px 0 2px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tut .tk{font-size:10.5px;font-weight:700;color:#8a6a1c;letter-spacing:.08em}
.tut .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tut .n{font-size:11px;color:#7d6a85}
.tut .btn{pointer-events:auto;font-size:12px;padding:5px 12px}
.tut::before,.tut::after{content:"";position:absolute;left:var(--ax,50%);transform:translateX(-50%);border:solid transparent}
.tut.up::before{bottom:calc(100% + 2px);border-width:0 9px 9px;border-bottom-color:#1a1418}
.tut.up::after{bottom:100%;border-width:0 7px 7px;border-bottom-color:#fbf5e6}
.hl{position:fixed;z-index:7;pointer-events:none;border:2px dashed #e8c35a;box-shadow:0 0 0 2px rgba(26,20,24,.6);animation:hlpulse 1s steps(2) infinite}
.hl.person{box-shadow:none}
@keyframes hlpulse{50%{border-color:rgba(232,195,90,.25)}}
@media (prefers-reduced-motion:reduce){.hl{animation:none}}
.banner{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:9;padding:10px 16px;text-align:center;font-weight:700;font-size:14px;line-height:1.5;white-space:pre-line;pointer-events:none;max-width:calc(100vw - 24px);word-break:keep-all}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,8,14,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel2);box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--hi),6px 6px 0 2px rgba(0,0,0,.35);padding:20px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;word-break:keep-all}
.card h2{font-size:18px;color:var(--gold)}
.card .side{padding:8px 10px;background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px}
body.mies .card .side{background:#fff}
.card .side b{font-size:12.5px}.card .acts{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:699px){
  .bell{width:48px;height:52px}.bub{max-width:168px;font-size:11.5px;line-height:16px}
  .narr{width:calc(100vw - 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 56px)}
  .stelebox{width:auto;left:var(--gl);padding:6px 8px}.stelebox .stele{display:flex;flex-wrap:wrap;gap:0 4px;padding:3px}.stelebox>.lbl{display:none}.kwbtn{white-space:nowrap;padding:2px 3px;font-size:11px}
}
</style></head><body>
<div class="screen"><canvas id="scene" aria-label="위에서 내려다본 복싱 체육관과 링"></canvas></div>
<div class="ptip" id="ptip" hidden></div>
<header class="hdr" id="hdr">
  <div class="bar panel"><h1 id="title">디자인 링</h1><span class="acts"><button class="btn ghost icon" id="snd" type="button" aria-pressed="true" aria-label="소리 켜고 끄기" title="소리 켜고 끄기"><img class="hicon" id="sndicon" alt=""></button><button class="btn ghost icon" id="reset" type="button" aria-label="처음으로" title="처음으로"><img class="hicon" id="reseticon" alt=""></button></span></div>
  <div class="center" id="center">
    <div class="rc c0" id="rn0"></div>
    <button class="bell" id="bell" type="button" aria-label="종 치기" title="종 치기"></button>
    <div class="rc c1" id="rn1"></div>
  </div>
</header>
<section class="narr panel" id="narr" aria-live="polite"><b id="nt"></b><span class="y" id="ny"></span><p id="nb"></p></section>
<aside class="stelebox panel"><span class="lbl">도감 · 모은 키워드</span><ul class="stele" id="stele"></ul></aside>
<div class="bubbles" id="bubbles"></div>
<div class="hl" id="hl" hidden></div>
<div class="tut" id="tut" hidden role="status"><span class="tk" id="tutk"></span><p id="tutt"></p><div class="row"><span class="n" id="tutn"></span><button class="btn" id="tutbtn" type="button" hidden>다음</button></div></div>
<div class="banner panel" id="banner" hidden></div>
<div class="modal" id="modal" hidden><div class="card" role="dialog" aria-modal="true"><div id="mbody" style="display:flex;flex-direction:column;gap:10px"></div><div class="acts"><button class="btn" id="mbtn" type="button"></button></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('scene'),ctx=cv.getContext('2d');
let W=384,H=240,SCALE=3;
const SKIN='#d9a070',EYE='#2a1c18',SHOE='#2b2024',OUT='#1a1418',GOLD='#e8c35a',BLUSH='#f0a088';

/* ---- sprites: the same 2-head chibi generator as Agora Ring ---- */
function tmpl(p,f){
  const r=[];
  if(p.bald)r.push('....ssssss....','..hssssssssh..','.hhsssssssshh.');
  else if(p.messy)r.push('...h.hhhh.h...','..hhhhhhhhhh..','.hhhhhhhhhhhh.');
  else if(p.parted)r.push('....hhhhhh....','..hhhhhhhhhh..','.hhhhhhhsshhh.');
  else r.push('....hhhhhh....','..hhhhhhhhhh..','.hhhhhhhhhhhh.');
  r.push('.hhsssssssshh.','.hssssssssssh.');
  const eyes=p.glasses?'.hkkkkkkkkkkh.':'.hssessssessh.';
  if(f===2&&!p.glasses)r.push('.hssssssssssh.',eyes);else r.push(p.glasses?'.hkekkkkkkekh.':eyes,eyes);
  r.push('.hpssssssssph.');
  if(p.beard)r.push('..sbbbbbbbbs..','...bbbbbbbb...');
  else if(p.moustache)r.push('..ssbbbbbbss..','...ssssssss...');
  else r.push('..ssssssssss..','...ssssssss...');
  r.push(p.beard?'...cbbbbbbc...':p.suit?'...cxxxxxxc...':'...cccccccc...');
  if(p.suit)r.push('.sccxxttxxccs.','.sccccttccccs.','..ccccttcccd..','..cccccccccd..','...cccccccd...');
  else r.push('.sxcccccccccs.','.scccxcccccds.','..ccccccxccd..','..ccccccccxd..','...cccccccd...');
  if(f===1)r.push('...ll....ll...','...ll....ll...');else r.push('....ll..ll....','....ll..ll....');
  return r;
}
function bake(rows,cmap,w,h){
  const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const g=c.getContext('2d');
  const filled=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&rows[y][x]!=='.';
  g.fillStyle=OUT;
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(filled(x,y))continue;if(filled(x-1,y)||filled(x+1,y)||filled(x,y-1)||filled(x,y+1))g.fillRect(x+1,y+1,1,1);}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(ch==='.')continue;g.fillStyle=cmap[ch]||'#f0f';g.fillRect(x+1,y+1,1,1);}
  return c;
}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn((x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);},g);return c;}
function outlined(src,col){
  const w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data;
  const op=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&d[(y*w+x)*4+3]>40;
  return mk(w+2,h+2,(R,g)=>{for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++)if(!op(x,y)&&(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1)))R(x+1,y+1,1,1,col);g.drawImage(src,1,1);});
}
function disc(R,cx,cy,rx,ry,col){for(let dy=-ry;dy<=ry;dy++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-dy*dy/(ry*ry))));R(cx-w,cy+dy,w*2+1,1,col);}}
function mono(src){ // Mies mode: every sprite collapses to white, two greys and black
  const c=mk(src.width,src.height,(R,g)=>g.drawImage(src,0,0)),g=c.getContext('2d'),im=g.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const l=.3*d[i]+.59*d[i+1]+.11*d[i+2],v=l<55?17:l<125?130:l<195?200:255;d[i]=d[i+1]=d[i+2]=v;}
  g.putImageData(im,0,0);return c;
}
function coachSpr(p){
  const cm={h:p.hair,s:SKIN,e:EYE,b:p.beard||p.moustache,c:p.cloth,d:p.dark,x:p.trim,t:p.tie,l:p.shoe||SHOE,p:BLUSH,k:'#141014'};
  const col=[0,1,2].map(f=>bake(tmpl(p,f),cm,14,18));
  return {col,bw:col.map(mono)};
}

/* ---- design objects: each drawn after the real thing; legs are added when walking ---- */
const ART={
strawberry(R){ // Strawberry Thief: indigo discharge print, mirrored thrushes and strawberries
  const I='#1e3566',I2='#2d4c86',T='#b98d4f',W='#efe6cf',S='#c23a34',G='#5c8f5a',Y='#e0b84f';
  R(0,0,30,2,'#7a5230');R(2,2,26,30,I);
  for(let y=4;y<32;y+=4)for(let x=3;x<27;x+=4)R(x+(y%8?2:0),y,1,1,I2);
  for(const m of [0,1]){const X=(x,w=1)=>m?30-x-w:x;
    for(const oy of [3,18]){
      R(X(4,5),oy+3,5,3,T);R(X(4,2),oy+1,2,2,T);R(X(3),oy+2,1,1,Y);R(X(5,3),oy+4,3,2,W);R(X(5),oy+1,1,1,OUT);R(X(9,3),oy+5,3,1,T); // bird
      R(X(11,2),oy+1,2,2,S);R(X(11),oy,1,1,G); // berry
      R(X(4,2),oy+8,2,2,S);R(X(5),oy+7,1,1,G);R(X(8,3),oy+9,3,1,G);R(X(10,2),oy+10,2,1,G);R(X(12,2),oy+8,2,3,W);R(X(12),oy+9,1,1,Y);
    }}
  R(14,8,2,18,G);R(13,13,4,3,W);R(14,14,2,1,S);R(2,31,26,1,'#132445');
},
kelmscott(R){ // Kelmscott Chaucer: heavy vine border, black-letter columns, Burne-Jones roundel
  const V='#f6efdc',B='#191413',M='#e8dfc6';
  R(0,0,30,36,V);R(28,0,2,36,M);R(0,35,30,1,'#bfb394');
  R(2,2,25,32,B);
  for(let y=3;y<33;y+=2){R(3+(y%4?1:0),y,1,1,V);R(25-(y%4?1:0),y,1,1,V);}
  for(let x=4;x<25;x+=2){R(x,3+(x%4?1:0),1,1,V);R(x,32-(x%4?1:0),1,1,V);}
  R(6,6,17,24,V);
  R(7,7,15,9,B);R(8,8,13,7,V);R(13,9,3,3,'#8d8a7f');R(12,12,5,3,'#55504a');R(9,13,2,2,'#8d8a7f');R(18,13,2,2,'#8d8a7f');
  for(let y=18;y<29;y+=2){R(8,y,6,1,B);R(16,y,6,1,B);}
  R(8,17,3,3,'#b22f22');R(9,18,1,1,V);
},
redhouse(R){ // Red House: red brick, steep tile roof, oversized chimney, Gothic porch arch, conical well
  const B='#b4472f',B2='#8e3423',T='#7a3f2a',T2='#5f2e1f',W='#efe4c8',D='#2f2a2a';
  R(24,1,5,12,B);R(24,1,5,1,B2);R(23,0,7,1,B2);
  for(let y=0;y<12;y++){const i=y;R(14-i,4+y,4+i*2,1,y%2?T:T2);}
  for(let y=0;y<11;y++){R(20,6+y,16-Math.max(0,y-1),0,T);R(19+0,5+y,15,1,y%2?T:T2);}
  R(2,16,32,20,B);for(let y=18;y<36;y+=3)for(let x=2+(y%2)*2;x<34;x+=4)R(x,y,2,1,B2);
  R(8,19,6,8,D);R(9,20,4,6,'#7fa6c4');R(10,20,1,6,W);R(9,23,4,1,W);R(9,18,4,1,W);
  R(22,20,4,4,D);R(23,21,2,2,'#7fa6c4');R(29,20,3,4,D);R(30,21,1,2,'#7fa6c4');
  R(17,26,8,10,W);R(18,25,6,1,W);R(19,24,4,1,W);R(18,27,6,9,'#402a20');R(19,26,4,1,'#402a20');R(20,29,3,7,'#6b3a23');
  R(3,31,2,5,'#d0c6aa');
},
looshaus(R){ // Looshaus (Goldman & Salatsch): green marble base, bare white upper floors with frameless windows
  const G='#4f7a62',G2='#2f5a48',G3='#8fb5a0',P='#f1eee6',P2='#cfcabf',D='#39404a',Cu='#6b8f7f';
  R(1,0,28,4,Cu);R(1,0,28,1,'#88aa9a');R(0,4,30,1,'#b9b4a8');
  R(1,5,28,16,P);R(26,5,3,16,P2);
  for(let y=7;y<20;y+=4)for(let x=4;x<27;x+=5)R(x,y,3,3,D);
  R(0,21,30,2,'#9b9385');
  R(1,23,28,15,G);for(let i=0;i<14;i++)R(2+i*2,24+(i*5)%12,3,1,G3);R(1,37,28,1,G2);
  for(const x of [7,20]){R(x,23,3,15,G3);R(x,23,1,15,'#d3e4da');R(x+2,23,1,15,G2);}
  R(11,26,8,12,'#22262b');R(14,26,1,12,G3);R(2,26,4,8,'#22262b');R(24,26,4,8,'#22262b');
},
essay(R){ // Ornament und Verbrechen: plain pamphlet, ornament struck through in red
  const P='#efe7d3',P2='#cdc3aa',K='#1d1818',C='#a8854a';
  R(0,0,26,34,P);R(24,0,2,34,P2);R(0,33,26,1,P2);R(3,3,18,3,K);R(3,8,12,2,K);
  disc(R,12,19,7,7,C);disc(R,12,19,5,5,P);disc(R,12,19,3,3,C);disc(R,12,19,1,1,P);
  for(const [x,y] of [[4,12],[20,12],[4,25],[20,25]]){R(x,y,2,2,C);}
  for(let i=0;i<15;i++){R(5+i,12+i,2,2,'#cf2b1f');R(19-i,12+i,2,2,'#cf2b1f');}
  R(3,29,18,1,K);R(3,31,12,1,K);
},
muller(R){ // Villa Müller: white cube, irregular windows with yellow frames, roof-terrace parapet

 essay:{name:'장식과 범죄',w:26,h:34,year:'글, 1908 무렵',clue:'문화의 진화란 일용품에서 장식을 없애 가는 과정이라고 쓴 글. 장식은 노동과 돈의 낭비라고 몰아붙였다.'},

 farnsworth:{name:'판스워스 주택',w:42,h:30,year:'주택, 1951',clue:'사방이 유리. 건축주 이디스 판스워스는 살기 어렵다며 불평했고, 설계자와 소송까지 갔다.'},

 oxford:{name:'옥스퍼드 자연사박물관',w:38,h:34,year:'건물, 1855–60',clue:'이 책의 고딕론을 따라 지은 건물. 아일랜드 석공들이 기둥머리마다 실제 식물을 저마다 다르게 새겼다.'},
 cadoro:{name:'베네치아 고딕 창',w:24,h:36,year:'스케치, 1850년대',clue:'직접 비계에 올라가 재고 그린 창. 똑같은 돌이 둘도 없다는 걸 증명하려고 수천 장의 메모를 남겼다.'},
 crystal:{name:'수정궁',w:42,h:30,year:'전시관, 1851',clue:'조립식 철과 유리로 몇 달 만에 올린 만국박람회장. 설계는 팩스턴. 박람회를 밀어붙인 이는 공무원 출신 기획자였다. 반대파는 "이제껏 없던 큰 온실"이라 비웃었다.'},
 teaset:{name:'서머리 티세트',w:36,h:26,year:'도자기, 1846',clue:'펠릭스 서머리라는 가명으로 디자인해 민턴에서 양산한 찻주전자. 좋은 디자인을 공장에서 싸게 뽑아 보자는 시도.'},

 englishhaus:{name:'영국 주택',w:28,h:36,year:'책, 1904–05',clue:'런던 주재 독일 대사관에서 일하며 영국 집을 조사해 쓴 세 권. 양식보다 합리적 생활에서 답을 찾았다.'},

 laubengang:{name:'퇴르텐 복도형 주택',w:38,h:28,year:'공동주택, 1930',clue:'데사우의 값싼 노동자 주택. 바깥 복도로 현관을 잇고 학교 공방 학생들이 함께 설계했다. 지금도 사람이 산다.'},

const zones=()=>{const o=['red','blue'],{x0,x1}=RING,w=(x1-x0)/o.length;return o.map((s,i)=>({s,a:x0+i*w,b:x0+(i+1)*w}));};
const halfRect=e=>{const hw=OBJ[e.id].w/2+1,{y0,y1}=RING,z=zones().find(q=>q.s===e.side),a=z.a+hw+3,b=z.b-hw-3,m=(z.a+z.b)/2;return {a:Math.min(a,m),b:Math.max(b,m),c:y0+Math.min(24,OBJ[e.id].h*.7),d:y1-4};};

const hudRects=()=>[...document.querySelectorAll('.narr,.stelebox,.tut')].filter(n=>!n.hidden).map(n=>{const b=n.getBoundingClientRect();return {a:b.left/SCALE,b:b.right/SCALE,c:b.top/SCALE,d:b.bottom/SCALE+6};});

/* ---- update ---- */
function update(dt){
  if(paused)return;
  for(const e of ents){
    if(e===drag)continue;
    if(fight)continue;
    if(e.wait>0){e.wait-=dt;e.frame=0;if(e.wait<=0)pickTarget(e);continue;}
    const dx=e.tx-e.x,dy=e.ty-e.y,l=Math.hypot(dx,dy);
    if(l<1.5){e.wait=.4+Math.random()*2.2;e.frame=0;continue;}
    const nx=e.x+dx/l*e.sp*dt,ny=e.y+dy/l*e.sp*dt;
    if(!e.side&&forbidden(nx,ny,e)&&!forbidden(e.x,e.y,e)){e.wait=.2;continue;}
    e.x=nx;e.y=ny;
    e.ft+=dt*1000;if(e.ft>170){e.ft=0;e.frame^=1;}
  }
  for(const c of coachE){
    if(c.walkIn){const dx=c.hx-c.x,dy=c.hy-c.y,l=Math.hypot(dx,dy);if(l<1){c.walkIn=false;c.x=c.hx;c.y=c.hy;}else{c.x+=dx/l*40*dt;c.y+=dy/l*40*dt;}}
    c.jump=Math.max(0,c.jump-dt);c.rage=Math.max(0,c.rage-dt);
    if(c.bub){posBubble(c);c.bubT-=dt;if(c.bubT<=0){c.bub.remove();c.bub=null;}}
  }
  if(!fight){shoutT-=dt;if(shoutT<=0&&coachE.length){const c=coachE[shoutI++%coachE.length];const q=C[c.key].quotes;bubble(c,q[c.q]);c.q=(c.q+1)%q.length;shoutT=3.4;}}
  for(const d of dust){d.x+=d.vx*dt;d.y+=d.vy*dt;d.life-=dt;}
  dust=dust.filter(d=>d.life>0);
  if(fight){
    fight.t+=dt;const {cx,cy}=RING;
    const n=fight.t<.5?9:4;for(let i=0;i<n;i++){const a=Math.random()*6.28,rr=Math.random();dust.push({x:cx+Math.cos(a)*rr*(RING.x1-RING.x0)*.36,y:cy+6+Math.sin(a)*rr*(RING.y1-RING.y0)*.38,vx:Math.cos(a)*14,vy:-6+Math.sin(a)*9,r:6+Math.random()*9|0,life:.5+Math.random()*.5});}
    fight.hit-=dt;if(fight.hit<=0){fight.hit=.17+Math.random()*.2;sPunch();
      const c=coachE[Math.random()*coachE.length|0];c.jump=.45;c.rage=.9;if(Math.random()<.45){const q=C[c.key].quotes;bubble(c,q[Math.random()*q.length|0],true);}
      (fight.stars=fight.stars||[]).push({x:cx+(Math.random()-.5)*(RING.x1-RING.x0)*.7,y:cy+(Math.random()-.5)*(RING.y1-RING.y0)*.7,t:.3});}
    if(fight.stars){for(const s of fight.stars)s.t-=dt;fight.stars=fight.stars.filter(s=>s.t>0);}
    if(fight.t>=fight.dur)endFight();
  }
}

/* ---- draw ---- */
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
function line(x0,y0,x1,y1,c){x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;ctx.fillStyle=c;for(;;){ctx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
const RC=['#d84a3a','#f4f4f4','#3b6fd6'],RH=[4,8,12];
const POST=[['#ece9e2','#b9b6ad'],['#ebc85e','#b9952e'],['#d23a2a','#922318'],['#2f5fc8','#1e3f8c']];
const POSTM=[['#fff','#999'],['#fff','#999'],['#fff','#999'],['#fff','#999']];
function post(x,y,c){R(x-4,y-19,8,20,OUT);R(x-3,y-15,6,15,c[0]);R(x+1,y-15,2,15,c[1]);R(x-3,y-18,6,3,c[1]);R(x-3,y-18,4,1,c[0]);}
function ringBack(){const {x0,x1,y0,y1}=RING,P=mies?POSTM:POST;
  post(x0+2,y0+2,P[0]);post(x1-2,y0+2,P[1]);
  for(let i=0;i<3;i++){const h=RH[i],c=mies?(i==1?'#fff':'#111'):RC[i];if(mies&&i==1)continue;line(x0+3,y0+2-h,x1-3,y0+2-h,c);line(x0+2,y0+3-h,x0+2,y1-2-h,c);line(x1-2,y0+3-h,x1-2,y1-2-h,c);}}
function ringFront(){const {x0,x1,y1}=RING,P=mies?POSTM:POST;
  for(let i=0;i<3;i++){const h=RH[i];if(mies&&i==1)continue;line(x0+3,y1-2-h,x1-3,y1-2-h,mies?'#111':RC[i]);}
  post(x0+2,y1-2,P[2]);post(x1-2,y1-2,P[3]);}
function drawEnt(e){
  const d=OBJ[e.id],s=sprOf(e.id),colored=!mies||ROUNDS[round].b.includes(e.id);
  let x=e.x,y=e.y,held=e===drag,fr=e.frame,jx=0,lift=0;
  if(fight){const sign=e.side==='red'?-1:1;e.ang+=.14*e.orb;const big=.5+.5*Math.sin(fight.t*2.3+e.ang);
    x=RING.cx+Math.cos(e.ang)*(RING.x1-RING.x0)*.34*big+sign*6;y=RING.cy+14+Math.sin(e.ang)*(RING.y1-RING.y0)*.26*big;fr=Math.floor(now/70)%2;}
  if(held){fr=Math.floor(now/70)%2;jx=Math.round(Math.sin(now/38)*1.6);lift=-4+(Math.floor(now/95)%2?-1:0);}
  x=Math.round(x+jx);y=Math.round(y);
  const shadow=mies?'rgba(0,0,0,.14)':'rgba(10,20,50,.32)';
  if(!held){R(x-d.w/2+2,y-1,d.w-4,2,shadow);}
  // feet only, tucked right under the body; the raised foot swaps with the frame
  const lx=Math.round(d.w*.22),len=7,sh=colored?'#c9402f':'#fff';
  for(const [o,up] of [[-lx,fr],[lx,1-fr]]){const fy=y-1-(up?1:0)+lift;R(x+o-3,fy-2,7,4,OUT);R(x+o-2,fy-1,5,2,sh);}
  const bob=Math.round(Math.sin(now/380+e.sp)),top=y-len-d.h-1+lift+bob;
  ctx.drawImage(colored?s.col:s.bw,x-Math.round(d.w/2)-1,top);
  if(held){const k=Math.floor(now/120)%2,c=mies?'#111':'#fff';R(x-d.w/2-5,top+6+k*3,2,1,c);R(x-d.w/2-6,top+10+k*3,1,1,c);R(x+d.w/2+4,top+8-k*3,2,1,c);R(x+d.w/2+5,top+4-k*3,1,1,c);R(x+d.w/2+2,top-1+k,2,2,mies?'#999':'#7cc4ec');}
  if(hover===e&&!drag&&!fight)R(x-d.w/2,y+2,d.w,1,mies?'#111':'rgba(255,255,255,.7)');

function drawCoach(c){
  const p=C[c.key],isColored=!mies||ROUNDS[round].blue===c.key;
  const hop=c.jump>0?Math.round(Math.abs(Math.sin(c.jump*14))*7):0;
  const blink=((now+c.corner*900)%3400)<140;
  const moving=c.walkIn||c.jump>0;const f=moving?Math.floor(now/110)%2:blink?2:0;
  const spr=(isColored?p.spr.col:p.spr.bw)[f],x=0,y=0,k=CS();
  ctx.save();ctx.translate(Math.round(c.x),Math.round(c.y));ctx.scale(k,k);
  ctx.fillStyle=mies?'rgba(0,0,0,.14)':'rgba(10,20,50,.32)';ctx.fillRect(x-5,y-1,10,2);
  if(c.corner===1){ctx.save();ctx.translate(x+8,0);ctx.scale(-1,1);ctx.drawImage(spr,0,y-20-hop);ctx.restore();}else ctx.drawImage(spr,x-8,y-20-hop);
  if(c.rage>0){const m=Math.floor(now/140)%2,cc=mies?'#111':'#e0563b';R(x-7,y-28-hop-m,2,2,cc);R(x+6,y-29-hop+m,2,2,cc);R(x-1,y-31-hop+m,2,1,cc);R(x-9,y-16-hop+m,2,1,'#fff');R(x+9,y-14-hop-m,2,1,'#fff');}
  ctx.restore();

function drawDust(){for(const d of dust){const a=Math.min(1,d.life*2.5),rr=d.r,x=Math.round(d.x),y=Math.round(d.y);ctx.globalAlpha=a;
  const P=(rx,ry,c)=>{for(let dy=-ry;dy<=ry;dy++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-dy*dy/(ry*ry))));R(x-w,y+dy,w*2+1,1,c);}};
  P(rr+1,Math.round(rr*.8)+1,mies?'#333':'#a08f70');P(rr,Math.round(rr*.8),mies?'#d4d4d4':'#e9dfc6');P(Math.max(1,rr-3),Math.max(1,Math.round(rr*.5)),mies?'#fff':'#fbf5e6');ctx.globalAlpha=1;}}
function drawStars(){if(!fight||!fight.stars)return;for(const s of fight.stars){const x=Math.round(s.x),y=Math.round(s.y),c=mies?'#111':GOLD;R(x-5,y-1,11,3,OUT);R(x-1,y-5,3,11,OUT);R(x-4,y,9,1,c);R(x,y-4,1,9,c);R(x-1,y-1,3,3,'#fff');}}
function draw(){
  ctx.drawImage(mies?bgM:bgC,0,0);
  ringBack();
  const inRing=[],outer=[];
  for(const e of ents){if(e===drag)continue;(e.side?inRing:outer).push(e);}

  if(drag)drawEnt(drag);

function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;now=t;update(dt);draw();updateTut();requestAnimationFrame(loop);}
